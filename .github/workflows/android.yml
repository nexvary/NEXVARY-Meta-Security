name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          sdkmanager --version

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Static checks
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/nexvary/metasecuritylab/MainActivity.java
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'targetSdk 35' app/build.gradle
          grep -q 'LAB-' app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Meta-Security-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
