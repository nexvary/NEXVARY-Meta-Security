name: Android HackGPT Integration Gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android 35
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: HackGPT connector tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r enterprise-connector/requirements.txt
          python -m unittest discover -s enterprise-connector -p 'test_*.py'

      - name: Static integration gate
        shell: bash
        run: |
          set -euo pipefail

          test -f HACKGPT_INTEGRATION.md
          test -f THIRD_PARTY_NOTICES.md
          test -f enterprise-connector/connector.py
          test -f enterprise-connector/test_connector.py
          test -f app/src/main/assets/hackgpt-lectures.js
          test -f app/src/main/assets/enterprise.js
          test -f app/src/enterprise/AndroidManifest.xml

          grep -q 'versionCode 261' app/build.gradle
          grep -q "versionName '2.61.0'" app/build.gradle
          grep -q 'productFlavors' app/build.gradle
          grep -q 'ENTERPRISE_MODE' app/build.gradle
          grep -q 'NEXVARY_CONNECTOR_URL' app/build.gradle

          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' app/src/enterprise/AndroidManifest.xml

          grep -q 'hackgpt-lectures.js' app/src/main/assets/index.html
          grep -q 'enterprise.js' app/src/main/assets/index.html
          grep -q 'data-view="hackgpt"' app/src/main/assets/index.html
          grep -q 'NEXVARY_ENTERPRISE_RESULT' app/src/main/assets/enterprise.js
          grep -q 'enterpriseMode' app/src/main/java/com/nexvary/metasecuritylab/MainActivity.java
          grep -q 'listHackGptSessions' app/src/main/java/com/nexvary/metasecuritylab/MainActivity.java
          grep -q 'getHackGptReport' app/src/main/java/com/nexvary/metasecuritylab/MainActivity.java
          grep -q 'registerAuthorization' app/src/main/java/com/nexvary/metasecuritylab/MainActivity.java

          node --check app/src/main/assets/labs.js
          node --check app/src/main/assets/curriculum.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/hackgpt-lectures.js
          node --check app/src/main/assets/enterprise.js

          python -m py_compile enterprise-connector/connector.py

          node - <<'NODE'
          global.window = {};
          require('./app/src/main/assets/labs.js');
          require('./app/src/main/assets/curriculum.js');
          require('./app/src/main/assets/hackgpt-lectures.js');

          const labs = window.NEXVARY_CURRICULUM.enrich(window.NEXVARY_DATA.labs);
          if (labs.length !== 100) throw new Error('Expected 100 labs');
          if (window.NEXVARY_DATA.tracks.length !== 10) throw new Error('Expected 10 tracks');
          if (!Array.isArray(window.NEXVARY_HACKGPT_LECTURES) || window.NEXVARY_HACKGPT_LECTURES.length < 10) {
            throw new Error('Expected at least 10 HackGPT lecture modules');
          }
          if (new Set(labs.map(x => x.id)).size !== 100) throw new Error('Duplicate lab IDs');
          console.log('Curriculum PASS: 100 labs / 10 tracks / ' + window.NEXVARY_HACKGPT_LECTURES.length + ' HackGPT lectures');
          NODE

      - name: Android lint
        run: gradle :app:lintTrainingDebug :app:lintEnterpriseDebug --stacktrace

      - name: Build both APK flavors
        run: gradle :app:assembleTrainingDebug :app:assembleEnterpriseDebug --stacktrace

      - name: Verify APK boundaries
        shell: bash
        run: |
          set -euo pipefail

          TRAINING="app/build/outputs/apk/training/debug/app-training-debug.apk"
          ENTERPRISE="app/build/outputs/apk/enterprise/debug/app-enterprise-debug.apk"

          test -s "$TRAINING"
          test -s "$ENTERPRISE"

          unzip -t "$TRAINING"
          unzip -t "$ENTERPRISE"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$AAPT" dump permissions "$TRAINING" | tee training-permissions.txt
          "$AAPT" dump permissions "$ENTERPRISE" | tee enterprise-permissions.txt

          ! grep -q 'android.permission.INTERNET' training-permissions.txt
          grep -q 'android.permission.INTERNET' enterprise-permissions.txt

          "$APKSIGNER" verify --verbose "$TRAINING"
          "$APKSIGNER" verify --verbose "$ENTERPRISE"

          sha256sum "$TRAINING" | tee training-sha256.txt
          sha256sum "$ENTERPRISE" | tee enterprise-sha256.txt

          ls -lh "$TRAINING" "$ENTERPRISE"

      - name: Upload Training APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Meta-Security-Training-2.61.0
          path: |
            app/build/outputs/apk/training/debug/app-training-debug.apk
            training-sha256.txt
            training-permissions.txt
            app/build/reports/lint-results-trainingDebug.html
          if-no-files-found: error

      - name: Upload Enterprise APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Meta-Security-Enterprise-2.61.0
          path: |
            app/build/outputs/apk/enterprise/debug/app-enterprise-debug.apk
            enterprise-sha256.txt
            enterprise-permissions.txt
            app/build/reports/lint-results-enterpriseDebug.html
          if-no-files-found: error
