name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android 35
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Stage 80 static gate
        shell: bash
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/styles.css
          test -f app/src/main/assets/labs.js
          test -f app/src/main/assets/app.js
          test -f app/src/main/java/com/nexvary/metasecuritylab/MainActivity.java
          test -f app/src/main/res/drawable/ic_nexvary.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'targetSdk 35' app/build.gradle
          grep -q "versionCode 80" app/build.gradle
          grep -q "versionName '1.80.0'" app/build.gradle
          node --check app/src/main/assets/labs.js
          node --check app/src/main/assets/app.js
          node - <<'NODE'
          global.window = {};
          require('./app/src/main/assets/labs.js');
          const d = window.NEXVARY_DATA;
          if (!d || d.labs.length !== 100 || d.tracks.length !== 10) {
            console.error('Curriculum gate failed', d && d.labs.length, d && d.tracks.length);
            process.exit(1);
          }
          const ids = new Set(d.labs.map(x => x.id));
          if (ids.size !== 100) {
            console.error('Duplicate lab IDs detected');
            process.exit(1);
          }
          console.log('Curriculum gate PASS: 100 unique labs / 10 tracks');
          NODE

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Meta-Security-Stage80-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
